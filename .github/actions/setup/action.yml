name: Setup pnpm and Node
description: Installe pnpm + Node (cache pnpm) et les dependances (frozen lockfile).

inputs:
  node-version:
    description: Version Node.js
    required: false
    default: '24'
  pnpm-version:
    description: Version pnpm
    required: false
    default: '11'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
